      "type": "select",
      "proxies": [
        "🚀 Best Ping",
        "🇺🇸 40 - US - VLESS/WS/TLS/UTLS - 443",
        "🇬🇧 64 - GB - VLESS/REALITY/PBK/SID/VISION/UTLS - 443",
        "🇬🇧 83 - GB - VLESS/REALITY/PBK/SID/VISION/UTLS - 443",
        "🇬🇧 92 - GB - VLESS/REALITY/PBK/SID/VISION/UTLS - 443",
        "DIRECT"
      ]
    },
    {
      "name": "🚀 Best Ping",
      "type": "url-test",
      "proxies": [
        "🇺🇸 40 - US - VLESS/WS/TLS/UTLS - 443",
        "🇬🇧 64 - GB - VLESS/REALITY/PBK/SID/VISION/UTLS - 443",
        "🇬🇧 83 - GB - VLESS/REALITY/PBK/SID/VISION/UTLS - 443",
        "🇬🇧 92 - GB - VLESS/REALITY/PBK/SID/VISION/UTLS - 443"
